name: Backend Check

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - name: Prisma generate
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/x
        run: npx prisma generate
      - name: Syntax check
        run: node --check src/index.js && node --check src/routes/chat.js && node --check src/ai/providers.js
